<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チャットマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* ログイン・参加前は、地図と地域ポイント関連UIを表示しません。 */
    body.pre-auth .map-panel,
    body.pre-auth .header-user,
    body.pre-auth #map,
    body.pre-auth .regional-points,
    body.pre-auth .theme-shop-open,
    body.pre-auth #online-count {
      display: none !important;
    }
    body.pre-auth .app-main {
      grid-template-columns: 1fr;
    }
    body.pre-auth .chat-panel {
      width: min(760px, 100%);
      margin: 0 auto;
    }
    body.pre-auth .setup-panel {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    #initial-input-holder{display:contents}
  </style>
</head>
<body class="pre-auth">
  <header class="app-header"><div><h1>チャットマップ</h1><p>地域の出来事を話すだけで、チャットと地図に共有します。</p></div><div class="header-user"><span id="current-username">ゲスト</span><span id="online-count">0人</span></div></header>
  <main class="app-main">
    <section class="chat-panel">
      <div id="setup-panel" class="setup-panel"><h2>チャットに参加</h2><p>ニックネームを入力してください</p><div id="initial-input-holder"><input id="username-input" maxlength="20" placeholder="ニックネーム"></div><button id="join-btn">参加する</button></div>
      <div id="chat-main" class="chat-main" hidden>
        <aside class="users-panel"><h2>オンラインユーザー</h2><ul id="users-list"></ul></aside>
        <div class="chat-right"><div id="messages" class="messages" aria-live="polite"></div><div class="status" id="status">投稿前に「場所を付ける」を選べます。</div><div class="input-area"><button id="image-btn" class="tool-btn" title="画像を送る">📷</button><input type="file" id="image-input" accept="image/*" hidden><button id="video-btn" class="tool-btn" title="動画を送る">🎞️</button><input type="file" id="video-input" accept="video/*" hidden><label class="location-toggle" title="オンにすると投稿内容から場所を解析して地図に表示します"><input type="checkbox" id="location-checkbox"><span>📍 場所を付ける</span></label><input id="message-input" maxlength="2000" placeholder="例：〇〇橋付近で道路が通れません" autocomplete="off"><button id="send-btn">送信</button></div></div>
      </div>
    </section>
    <section class="map-panel"><div class="panel-heading"><div><h2>地域マップ</h2><p>投稿された場所を色分けして表示します。</p></div><div class="map-filters" aria-label="投稿種類の表示切替"><span class="filter-title">表示：</span><button type="button" class="map-filter active" data-filter="all">すべて</button><button type="button" class="map-filter" data-filter="交通障害">🔴 交通障害</button><button type="button" class="map-filter" data-filter="助け合い">🟢 助け合い</button><button type="button" class="map-filter" data-filter="イベント">🟠 イベント</button><button type="button" class="map-filter" data-filter="鳥獣目撃">🟣 鳥獣目撃</button><button type="button" class="map-filter" data-filter="その他">⚪ その他</button></div><div class="legend"><span><i class="legend-dot traffic"></i>交通障害</span><span><i class="legend-dot help"></i>助け合い</span><span><i class="legend-dot event"></i>イベント</span><span><i class="legend-dot wildlife"></i>鳥獣目撃</span><span><i class="legend-dot other"></i>その他</span></div></div><div id="map"></div></section>
  </main>
  <div id="call-modal" class="call-modal" hidden><div class="call-backdrop"></div><div class="call-box"><div class="call-header"><strong id="call-status">通話</strong></div><div class="call-videos"><video id="remote-video" autoplay playsinline></video><video id="local-video" autoplay muted playsinline></video></div><div class="call-controls"><button id="call-accept-btn">✅ 応答</button><button id="call-decline-btn">✖️ 拒否</button><button id="mute-btn" class="call-action-mute" hidden>🎤 ミュート</button><button id="cam-toggle-btn" class="call-action-camera" hidden>📹 カメラOFF</button><button id="minimize-btn" hidden>↙️ 小さくする</button><button id="call-end-btn" class="danger" hidden>📞 通話終了</button></div></div></div>
  <div id="mini-call-bar" class="mini-call-bar" hidden><video id="mini-local" autoplay muted playsinline></video><video id="mini-remote" autoplay playsinline></video><button id="mini-unminimize">↗️ 通話を開く</button><button id="mini-end" class="danger">📞 終了</button></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="/socket.io/socket.io.js"></script>
  <script>
    (() => {
      const revealApp = () => {
        document.body.classList.remove('pre-auth');
        setTimeout(() => {
          if (window.ruralMap?.invalidateSize) window.ruralMap.invalidateSize();
        }, 100);
      };
      window.addEventListener('rural-account-authenticated', revealApp);
      if (typeof socket !== 'undefined') socket.on('username-accepted', revealApp);
    })();
  </script>
  <script>
    (() => {
      const originalLeafletMap = L.map.bind(L);
      L.map = (...args) => {
        const createdMap = originalLeafletMap(...args);
        window.ruralMap = createdMap;
        return createdMap;
      };
    })();
  </script>
  <script>
    (() => {
      const originalFetch = window.fetch.bind(window);
      window.fetch = async (input, init = {}) => {
        const url = typeof input === 'string' ? input : input?.url || '';
        if (url === '/api/messages' && init?.body) {
          try {
            const body = JSON.parse(init.body);
            const useLocation = document.getElementById('location-checkbox')?.checked === true;
            if (!useLocation) {
              const message = String(body.text || '').trim();
              if (message && typeof socket !== 'undefined' && socket?.connected) {
                document.getElementById('status').textContent = '場所を付けずに投稿しています…';
                socket.emit('send-message', { message });
              }
              return new Response(JSON.stringify({ locationData: null, geocodeError: null }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              });
            }
          } catch (error) {
            console.error('投稿モードの切り替えに失敗:', error);
          }
        }
        return originalFetch(input, init);
      };
    })();
  </script>
  <script>
    (() => {
      const MARKER_TYPES = {
        '#d64545': '交通障害',
        '#2d8a57': '助け合い',
        '#e39a28': 'イベント',
        '#8b5cf6': '鳥獣目撃',
        '#6c7a89': 'その他'
      };
      let activeFilter = 'all';
      const markerRegistry = [];
      const originalMarker = L.marker.bind(L);
      const originalAddTo = L.Marker.prototype.addTo;

      function detectMarkerType(marker) {
        const html = String(marker?.options?.icon?.options?.html || '').toLowerCase();
        for (const [color, type] of Object.entries(MARKER_TYPES)) {
          if (html.includes(color)) return type;
        }
        return 'その他';
      }

      L.marker = function(latlng, options = {}) {
        const marker = originalMarker(latlng, options);
        marker.__eventType = detectMarkerType(marker);
        marker.__registeredForFilter = false;
        marker.__originalAddTo = originalAddTo.bind(marker);
        marker.addTo = function(targetMap) {
          if (!marker.__registeredForFilter) {
            markerRegistry.push({ marker, targetMap });
            marker.__registeredForFilter = true;
          }
          if (activeFilter === 'all' || activeFilter === marker.__eventType) {
            marker.__originalAddTo(targetMap);
          }
          return marker;
        };
        return marker;
      };

      window.setMapEventFilter = (filter) => {
        activeFilter = filter;
        markerRegistry.forEach(({ marker, targetMap }) => {
          const visible = filter === 'all' || filter === marker.__eventType;
          if (visible) targetMap.addLayer(marker);
          else if (targetMap.hasLayer(marker)) targetMap.removeLayer(marker);
        });
        document.querySelectorAll('.map-filter').forEach(button => {
          button.classList.toggle('active', button.dataset.filter === filter);
        });
      };

      document.addEventListener('click', event => {
        const button = event.target.closest('.map-filter');
        if (!button) return;
        window.setMapEventFilter(button.dataset.filter || 'all');
      });
    })();
  </script>
  <script src="/client.js"></script>
  <script src="/auth.js"></script>
  <script src="/account-auto-login.js"></script>
  <script src="/chat-delete.js"></script>
  <script src="/points.js"></script>
  <script src="/theme-shop.js"></script>
  <script src="/map-delete.js"></script>
  <script src="/chat-map-link.js"></script>
  <script>
    const locationCheckbox = document.getElementById('location-checkbox');
    const statusEl = document.getElementById('status');
    locationCheckbox?.addEventListener('change', () => {
      statusEl.textContent = locationCheckbox.checked
        ? '場所を付けて投稿します。送信時にAIが場所を解析します。'
        : '場所を付けずに投稿します。チャットのみ表示されます。';
    });

    /* 通話ボタンの状態を、アイコン＋色＋説明で直感的に表示します。 */
    (() => {
      const muteBtn = document.getElementById('mute-btn');
      const camBtn = document.getElementById('cam-toggle-btn');
      const minimizeBtn = document.getElementById('minimize-btn');
      const endBtn = document.getElementById('call-end-btn');
      const acceptBtn = document.getElementById('call-accept-btn');
      const declineBtn = document.getElementById('call-decline-btn');
      const miniUnminimize = document.getElementById('mini-unminimize');
      const miniEnd = document.getElementById('mini-end');

      const decorateCallButton = (button, type) => {
        if (!button) return;
        const text = button.textContent.trim();
        button.classList.remove('is-active', 'is-off');
        if (type === 'mute') {
          const muted = text.includes('解除');
          button.textContent = muted ? '🔇 ミュート解除' : '🎤 ミュート';
          button.title = muted ? 'マイクをオンにします' : 'マイクをオフにします';
          button.setAttribute('aria-label', button.title);
          button.classList.toggle('is-off', muted);
        } else if (type === 'camera') {
          const cameraOff = text.includes('カメラON');
          button.textContent = cameraOff ? '📷 カメラON' : '📹 カメラOFF';
          button.title = cameraOff ? 'カメラをオンにします' : 'カメラをオフにします';
          button.setAttribute('aria-label', button.title);
          button.classList.toggle('is-off', cameraOff);
        } else if (type === 'minimize') {
          button.textContent = '↙️ 小さくする';
          button.title = '通話画面を小さくします';
        } else if (type === 'end') {
          button.textContent = '📞 通話終了';
          button.title = '通話を終了します';
        } else if (type === 'accept') {
          button.textContent = '✅ 応答';
          button.title = '通話に応答します';
        } else if (type === 'decline') {
          button.textContent = '✖️ 拒否';
          button.title = '通話を拒否します';
        } else if (type === 'open-mini') {
          button.textContent = '↗️ 通話を開く';
          button.title = '通話画面を開きます';
        } else if (type === 'mini-end') {
          button.textContent = '📞 終了';
          button.title = '通話を終了します';
        }
      };

      const refresh = () => {
        decorateCallButton(muteBtn, 'mute');
        decorateCallButton(camBtn, 'camera');
        decorateCallButton(minimizeBtn, 'minimize');
        decorateCallButton(endBtn, 'end');
        decorateCallButton(acceptBtn, 'accept');
        decorateCallButton(declineBtn, 'decline');
        decorateCallButton(miniUnminimize, 'open-mini');
        decorateCallButton(miniEnd, 'mini-end');
      };

      refresh();
      const observer = new MutationObserver(refresh);
      [muteBtn, camBtn, minimizeBtn, endBtn, acceptBtn, declineBtn, miniUnminimize, miniEnd]
        .filter(Boolean)
        .forEach(button => observer.observe(button, { childList: true, characterData: true, subtree: true }));
    })();
  </script>
</body>
</html>
