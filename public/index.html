<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>田舎力チャットマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #21342c; background: #eef2e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { padding: 1.25rem 5vw; background: #234d3c; color: #fff; }
    header h1 { margin: 0; font-size: clamp(1.3rem, 3vw, 2rem); }
    header p { margin: .35rem 0 0; color: #d6e6d7; }
    main { display: grid; grid-template-columns: minmax(280px, .8fr) minmax(360px, 1.4fr); gap: 1rem; max-width: 1400px; margin: 1rem auto; padding: 0 1rem; }
    section { background: #fff; border: 1px solid #d9e2d6; border-radius: 8px; overflow: hidden; }
    .panel-heading { padding: .9rem 1rem; border-bottom: 1px solid #e3e9e0; font-weight: 700; }
    #messages { min-height: 480px; max-height: 62vh; overflow-y: auto; padding: 1rem; }
    .message { padding: .7rem; margin-bottom: .7rem; background: #f1f5ee; border-radius: 6px; }
    .message small { color: #60756a; }
    form { display: flex; gap: .5rem; padding: 1rem; border-top: 1px solid #e3e9e0; }
    input, button { font: inherit; }
    input { min-width: 0; flex: 1; padding: .75rem; border: 1px solid #b9c9b8; border-radius: 5px; }
    button { padding: .75rem 1rem; border: 0; border-radius: 5px; background: #d96b3b; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #map { min-height: 560px; height: 70vh; }
    .status { padding: 0 1rem .75rem; color: #68796e; font-size: .9rem; min-height: 2.5rem; }
    .map-note { padding: .65rem 1rem; font-size: .82rem; color: #68796e; border-bottom: 1px solid #e3e9e0; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } #map { height: 55vh; min-height: 360px; } #messages { min-height: 280px; } }
  </style>
</head>
<body>
  <header>
    <h1>田舎力チャットマップ</h1>
    <p>地域の出来事を話すだけで、みんなの地図に共有します。</p>
  </header>

  <main>
    <section aria-label="チャット">
      <div class="panel-heading">地域チャット</div>
      <div id="messages" aria-live="polite"></div>
      <div class="status" id="status">場所を含むメッセージはAIが解析して地図に表示します。</div>
      <form id="message-form">
        <input id="message-input" maxlength="2000" required placeholder="例：〇〇橋付近で倒木があります" autocomplete="off">
        <button id="send-button" type="submit">送信</button>
      </form>
    </section>

    <section aria-label="地図">
      <div class="panel-heading">地域マップ</div>
      <div class="map-note">ピンをクリックすると、イベント種別・要約・元の投稿を確認できます。</div>
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // 地域に合わせて変更してください。
    // 現在は広島市付近を初期表示にしています。
    const DEFAULT_CENTER = [34.3853, 132.4553];
    const DEFAULT_ZOOM = 11;

    const map = L.map('map').setView(DEFAULT_CENTER, DEFAULT_ZOOM);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const socket = io();
    const userId = `web-${crypto.randomUUID()}`;
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#message-form');
    const input = document.querySelector('#message-input');
    const button = document.querySelector('#send-button');
    const status = document.querySelector('#status');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[character]));
    }

    function addMessage(data) {
      const item = document.createElement('article');
      item.className = 'message';
      const timestamp = data.timestamp || (data.createdAt
        ? new Date(data.createdAt).toLocaleString('ja-JP')
        : new Date().toLocaleTimeString('ja-JP'));

      item.innerHTML = `
        <strong>${escapeHtml(data.username || data.userId || '投稿者')}</strong><br>
        ${escapeHtml(data.message || data.text)}<br>
        <small>${escapeHtml(timestamp)}</small>
      `;

      messages.append(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function addMarker(message) {
      const location = message.locationData;
      if (!location) return false;

      const lat = Number(location.lat);
      const lng = Number(location.lng);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return false;

      const popupHtml = `
        <div>
          <strong>${escapeHtml(location.eventType)}</strong><br>
          ${escapeHtml(location.summary)}<br>
          <small>${escapeHtml(location.locationName)}</small>
          <hr>
          ${escapeHtml(message.text || message.message || '')}
        </div>
      `;

      L.marker([lat, lng])
        .addTo(map)
        .bindPopup(popupHtml);

      map.setView([lat, lng], Math.max(map.getZoom(), 14));
      return true;
    }

    // 他ユーザーの投稿をSocket.IOで受信したとき。
    socket.on('receive-message', data => {
      addMessage(data);
      addMarker(data);
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      button.disabled = true;
      status.textContent = 'AIが場所とイベント種別を解析しています…';

      try {
        const response = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, userId })
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.error || '送信に失敗しました');
        }

        // /api/messages のレスポンスには locationData が含まれるため、
        // 自分の投稿だけはここで即時にピンを追加します。
        // チャット本文はサーバーのSocket.IOイベントで全員に配信されます。
        if (result.locationData) {
          addMarker(result);
          status.textContent = `${result.locationData.locationName} に「${result.locationData.eventType}」のピンを追加しました。`;
        } else if (result.geocodeError) {
          status.textContent = `投稿しました。ただし${result.geocodeError}。`;
        } else if (result.analysis?.hasLocation) {
          status.textContent = '場所は検出されましたが、地図上の位置を特定できませんでした。';
        } else {
          status.textContent = '場所を特定できなかったため、チャットだけに投稿しました。';
        }

        input.value = '';
      } catch (error) {
        console.error(error);
        status.textContent = error.message || '送信中にエラーが発生しました。';
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
