<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>田舎力チャットマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="app-header"><div><h1>田舎力チャットマップ</h1><p>地域の出来事を話すだけで、チャットと地図に共有します。</p></div><div class="header-user"><span id="current-username">ゲスト</span><span id="online-count">0人</span></div></header>
  <main class="app-main">
    <section class="chat-panel">
      <div id="setup-panel" class="setup-panel"><h2>チャットに参加</h2><p>ニックネームを入力してください</p><input id="username-input" maxlength="20" placeholder="ニックネーム"><button id="join-btn">参加する</button></div>
      <div id="chat-main" class="chat-main" hidden>
        <aside class="users-panel"><h2>オンラインユーザー</h2><ul id="users-list"></ul></aside>
        <div class="chat-right"><div id="messages" class="messages" aria-live="polite"></div><div class="status" id="status">投稿前に「場所を付ける」を選べます。</div><div class="input-area"><button id="image-btn" class="tool-btn" title="画像を送る">📷</button><input type="file" id="image-input" accept="image/*" hidden><button id="video-btn" class="tool-btn" title="動画を送る">🎞️</button><input type="file" id="video-input" accept="video/*" hidden><label class="location-toggle" title="オンにすると投稿内容から場所を解析して地図に表示します"><input type="checkbox" id="location-checkbox"><span>📍 場所を付ける</span></label><input id="message-input" maxlength="2000" placeholder="例：〇〇橋付近で道路が通れません" autocomplete="off"><button id="send-btn">送信</button></div></div>
      </div>
    </section>
    <section class="map-panel"><div class="panel-heading"><div><h2>地域マップ</h2><p>投稿された場所を色分けして表示します。</p></div><div class="legend"><span><i class="legend-dot traffic"></i>交通障害</span><span><i class="legend-dot help"></i>助け合い</span><span><i class="legend-dot event"></i>イベント</span><span><i class="legend-dot wildlife"></i>鳥獣目撃</span><span><i class="legend-dot other"></i>その他</span></div></div><div id="map"></div></section>
  </main>
  <div id="call-modal" class="call-modal" hidden><div class="call-backdrop"></div><div class="call-box"><div class="call-header"><strong id="call-status">通話</strong></div><div class="call-videos"><video id="remote-video" autoplay playsinline></video><video id="local-video" autoplay muted playsinline></video></div><div class="call-controls"><button id="call-accept-btn">応答</button><button id="call-decline-btn">拒否</button><button id="mute-btn" hidden>ミュート</button><button id="cam-toggle-btn" hidden>カメラOFF</button><button id="minimize-btn" hidden>最小化</button><button id="call-end-btn" class="danger" hidden>通話終了</button></div></div></div>
  <div id="mini-call-bar" class="mini-call-bar" hidden><video id="mini-local" autoplay muted playsinline></video><video id="mini-remote" autoplay playsinline></video><button id="mini-unminimize">展開</button><button id="mini-end" class="danger">終了</button></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="/socket.io/socket.io.js"></script>
  <script>
    (() => {
      const originalFetch = window.fetch.bind(window);
      window.fetch = async (input, init = {}) => {
        const url = typeof input === 'string' ? input : input?.url || '';
        if (url === '/api/messages' && init?.body) {
          try {
            const body = JSON.parse(init.body);
            const useLocation = document.getElementById('location-checkbox')?.checked === true;
            if (!useLocation) {
              const message = String(body.text || '').trim();
              if (message && typeof socket !== 'undefined' && socket?.connected) {
                document.getElementById('status').textContent = '場所を付けずに投稿しています…';
                socket.emit('send-message', { message });
              }
              return new Response(JSON.stringify({ locationData: null, geocodeError: null }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              });
            }
          } catch (error) {
            console.error('投稿モードの切り替えに失敗:', error);
          }
        }
        return originalFetch(input, init);
      };
    })();
  </script>
  <script src="/client.js"></script>
  <script>
    const locationCheckbox = document.getElementById('location-checkbox');
    const statusEl = document.getElementById('status');
    locationCheckbox?.addEventListener('change', () => {
      statusEl.textContent = locationCheckbox.checked
        ? '場所を付けて投稿します。送信時にAIが場所を解析します。'
        : '場所を付けずに投稿します。チャットのみ表示されます。';
    });
  </script>
</body>
</html>
