<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>田舎力チャットマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { font-family: system-ui, sans-serif; color: #21342c; background: #eef2e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { padding: 1.25rem 5vw; background: #234d3c; color: #fff; }
    header h1 { margin: 0; font-size: clamp(1.3rem, 3vw, 2rem); }
    header p { margin: .35rem 0 0; color: #d6e6d7; }
    main { display: grid; grid-template-columns: minmax(280px, .8fr) minmax(360px, 1.4fr); gap: 1rem; max-width: 1400px; margin: 1rem auto; padding: 0 1rem; }
    section { background: #fff; border: 1px solid #d9e2d6; border-radius: 8px; overflow: hidden; }
    .panel-heading { padding: .9rem 1rem; border-bottom: 1px solid #e3e9e0; font-weight: 700; }
    #messages { min-height: 480px; max-height: 62vh; overflow-y: auto; padding: 1rem; }
    .message { padding: .7rem; margin-bottom: .7rem; background: #f1f5ee; border-radius: 6px; }
    .message small { color: #60756a; }
    form { display: flex; gap: .5rem; padding: 1rem; border-top: 1px solid #e3e9e0; }
    input, button { font: inherit; }
    input { min-width: 0; flex: 1; padding: .75rem; border: 1px solid #b9c9b8; border-radius: 5px; }
    button { padding: .75rem 1rem; border: 0; border-radius: 5px; background: #d96b3b; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #map { min-height: 560px; height: 70vh; }
    .status { padding: 0 1rem .75rem; color: #68796e; font-size: .9rem; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } #map { height: 55vh; min-height: 360px; } #messages { min-height: 280px; } }
  </style>
</head>
<body>
  <header><h1>田舎力チャットマップ</h1><p>地域の出来事を話すだけで、みんなの地図に共有します。</p></header>
  <main>
    <section aria-label="チャット">
      <div class="panel-heading">地域チャット</div>
      <div id="messages" aria-live="polite"></div>
      <div class="status" id="status">場所を含むメッセージは地図に表示されます。</div>
      <form id="message-form"><input id="message-input" maxlength="2000" required placeholder="例：〇〇橋付近で倒木があります" autocomplete="off"><button id="send-button" type="submit">送信</button></form>
    </section>
    <section aria-label="地図"><div class="panel-heading">地域マップ</div><div id="map"></div></section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const map = L.map('map').setView([35.6812, 139.7671], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
    const socket = io();
    const userId = `web-${crypto.randomUUID()}`;
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#message-form');
    const input = document.querySelector('#message-input');
    const button = document.querySelector('#send-button');
    const status = document.querySelector('#status');
    function escapeHtml(value) { return value.replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character])); }
    function addMessage(data) {
      const item = document.createElement('article');
      item.className = 'message';
      item.innerHTML = `<strong>${escapeHtml(data.username || data.userId || '投稿者')}</strong><br>${escapeHtml(data.message || data.text)}<br><small>${escapeHtml(data.timestamp || new Date(data.createdAt).toLocaleString('ja-JP'))}</small>`;
      messages.append(item); messages.scrollTop = messages.scrollHeight;
    }
    function addMarker(message) {
      const location = message.locationData;
      if (!location) return;
      L.marker([location.lat, location.lng]).addTo(map).bindPopup(`<strong>${escapeHtml(location.eventType)}</strong><br>${escapeHtml(location.summary)}<br><small>${escapeHtml(location.locationName)}</small><hr>${escapeHtml(message.text)}`);
      map.setView([location.lat, location.lng], Math.max(map.getZoom(), 13));
    }
    socket.on('receive-message', addMessage);
    form.addEventListener('submit', async event => {
      event.preventDefault(); const text = input.value.trim(); if (!text) return;
      button.disabled = true; status.textContent = 'メッセージを解析しています…';
      try {
        const response = await fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, userId }) });
        const result = await response.json(); if (!response.ok) throw new Error(result.error || '送信に失敗しました');
        addMarker(result); status.textContent = result.locationData ? `${result.locationData.locationName} にピンを追加しました。` : '場所を特定できなかったため、チャットだけに投稿しました。'; input.value = '';
      } catch (error) { status.textContent = error.message; } finally { button.disabled = false; input.focus(); }
    });
  </script>
</body>
</html>
