services:
  - type: web
    name: rural-urban-web
    env: node
    plan: free
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://rural-urban-api.onrender.com
  - type: web
    name: rural-urban-api
    env: node
    plan: free
    buildCommand: cd api && npm install && npm run build
    startCommand: cd api && npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
